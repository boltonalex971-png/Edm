<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDM Platform - Subroot Navigation Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background-color: #f5f5f5; color: #212121; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: #1a237e; color: white; height: 64px; display: flex; align-items: center; padding: 0 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 1300; }
        .logo-box { background-color: #def1de; color: #000; padding: 4px 12px; border-radius: 4px; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 18px; }
        .nav { display: flex; gap: 8px; margin-left: 32px; flex: 1; }
        .nav-item { padding: 8px 16px; border-radius: 4px; font-size: 14px; color: rgba(255,255,255,0.8); cursor: pointer; }
        .nav-item.active { background: rgba(255,255,255,0.15); color: white; font-weight: 600; }
        .main-content { flex: 1; padding: 24px; display: flex; flex-direction: column; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e0e0e0; }
        .page-title h2 { font-size: 28px; font-weight: 400; color: #212121; }
        .segmented-control { display: flex; background-color: #ebebeb; padding: 4px; border-radius: 8px; border: 1px solid #d1d1d1; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }
        .segment-btn { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; color: #616161; cursor: pointer; text-decoration: none; transition: all 0.2s ease; }
        .segment-btn .material-icons { font-size: 18px; color: #757575; }
        .segment-btn:hover { color: #212121; background-color: rgba(255,255,255,0.4); }
        .segment-btn.active { background-color: #ffffff; color: #1976d2; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .segment-btn.active .material-icons { color: #1976d2; }
        .content-body { flex: 1; background: white; border: 1px solid #e0e0e0; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #9e9e9e; font-style: italic; }
        .footer { background: white; border-top: 1px solid #e0e0e0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #757575; }
        .status-indicator { display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; box-shadow: 0 0 4px #4caf50; }
        .version-chip { border: 1px solid #e0e0e0; padding: 2px 8px; border-radius: 4px; background: #f5f5f5; font-weight: 500; }
    </style>
</head>
<body>
    <header class="header"><div class="logo-box">Technology</div><nav class="nav"><div class="nav-item">Dashboard</div><div class="nav-item active">Configuration</div><div class="nav-item">Plugins</div></nav></header>
    <main class="main-content">
        <div class="page-header">
            <div class="page-title"><h2>Configuration</h2></div>
            <div class="segmented-control">
                <a href="#" class="segment-btn active"><span class="material-icons">account_tree</span>Processes</a>
                <a href="#" class="segment-btn"><span class="material-icons">business</span>Workplaces</a>
                <a href="#" class="segment-btn"><span class="material-icons">dns</span>Hosts</a>
                <a href="#" class="segment-btn"><span class="material-icons">memory</span>Devices</a>
            </div>
        </div>
        <div class="content-body">Master-Detail content for the selected section goes here.</div>
    </main>
    <footer class="footer"><div class="status-indicator"><div class="dot"></div>System Connected</div><div style="display: flex; gap: 16px; align-items: center;"><span class="version-chip">v0.1.0</span><a href="#" style="color: inherit; text-decoration: none;">Documentation</a><a href="#" style="color: inherit; text-decoration: none;">Support</a></div></footer>
</body>
</html>
